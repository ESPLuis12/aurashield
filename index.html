<style>
/* ================================================================
   ASTRAL STORE — Design tokens
   ================================================================ */
:root{
  --void:#0a0512;
  --void-2:#0e081a;
  --surface:#160e28;
  --surface-2:#1d1436;
  --border:rgba(177,94,255,.16);
  --border-strong:rgba(177,94,255,.4);
  --violet:#b15eff;
  --violet-soft:#8c4bd6;
  --aurora:#2bf5c6;
  --pink:#ff3d7d;
  --text:#f5f1ff;
  --muted:#ab9fc7;
  --muted-2:#786a96;

  --font-display:'Space Grotesk', sans-serif;
  --font-body:'Manrope', sans-serif;
  --font-mono:'JetBrains Mono', monospace;

  --radius-l:28px;
  --radius-m:18px;
  --radius-s:10px;
  --max:1200px;
}

*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important;}
}

body{
  margin:0;
  background:var(--void);
  color:var(--text);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

img{max-width:100%; display:block;}
a{color:inherit; text-decoration:none;}
ul{list-style:none; margin:0; padding:0;}
button{font-family:inherit; cursor:pointer;}
[hidden]{display:none !important;}

::selection{background:var(--violet); color:#fff;}

:focus-visible{
  outline:2px solid var(--aurora);
  outline-offset:3px;
  border-radius:4px;
}

.skip-link{
  position:absolute; left:-999px; top:0;
  background:var(--aurora); color:#031611; padding:.8em 1.4em;
  z-index:999; border-radius:0 0 10px 0; font-weight:700;
}
.skip-link:focus{left:0;}

.wrap{max-width:var(--max); margin:0 auto; padding:0 24px;}

.eyebrow{
  display:inline-flex; align-items:center; gap:8px;
  font-family:var(--font-mono); font-size:.72rem; letter-spacing:.14em;
  text-transform:uppercase; color:var(--aurora); margin:0 0 14px;
}
.eyebrow::before{content:''; width:16px; height:1px; background:var(--aurora);}

h1,h2,h3{font-family:var(--font-display); font-weight:700; margin:0; letter-spacing:-.01em;}

.section-head{max-width:640px; margin:0 0 56px;}
.section-head h2{font-size:clamp(1.8rem,4vw,2.7rem); margin-bottom:14px;}
.section-head p{color:var(--muted); font-size:1.05rem; margin:0;}

section{position:relative; padding:120px 0; z-index:2;}
@media (max-width:720px){ section{padding:80px 0;} }

/* ================================================================
   FONDO — starfield + nebula
   ================================================================ */
#stars{
  position:fixed; inset:-5% -5% -5% -5%; width:110%; height:110%;
  z-index:0; pointer-events:none;
  transition:transform .3s ease-out;
}
.nebula{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;}
.blob{
  position:absolute; border-radius:50%; filter:blur(90px);
  mix-blend-mode:screen; opacity:.55;
  animation:drift 26s ease-in-out infinite;
}
.b1{width:46vw; height:46vw; top:-14%; left:-10%; background:radial-gradient(circle,var(--violet),transparent 70%);}
.b2{width:38vw; height:38vw; bottom:-16%; right:-8%; background:radial-gradient(circle,var(--pink),transparent 70%); animation-duration:32s; animation-delay:-6s;}
.b3{width:30vw; height:30vw; top:35%; left:55%; background:radial-gradient(circle,var(--aurora),transparent 70%); opacity:.3; animation-duration:22s; animation-delay:-12s;}
@keyframes drift{
  0%,100%{transform:translate(0,0) scale(1);}
  33%{transform:translate(4%,6%) scale(1.08);}
  66%{transform:translate(-5%,-3%) scale(.95);}
}

/* ================================================================
   HEADER
   ================================================================ */
header.site{
  position:fixed; top:0; left:0; right:0; z-index:50;
  padding:18px 0;
  transition:background .3s ease, backdrop-filter .3s ease, border-color .3s ease, padding .3s ease;
  border-bottom:1px solid transparent;
}
header.site.scrolled{
  background:rgba(10,5,18,.72);
  backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  border-bottom-color:var(--border);
  padding:12px 0;
}
.nav-inner{display:flex; align-items:center; justify-content:space-between; gap:24px;}
.brand{display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:700; font-size:1.15rem;}
.brand-mark{
  width:34px; height:34px; border-radius:10px; position:relative; flex:none;
  background:linear-gradient(155deg,var(--violet),var(--pink));
  box-shadow:0 0 22px rgba(177,94,255,.55);
}
.brand-mark::after{
  content:'✦'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:.95rem; color:#fff;
}
nav.primary-nav{display:flex; align-items:center; gap:32px;}
nav.primary-nav a{
  font-size:.92rem; color:var(--muted); font-weight:600; position:relative; padding:4px 0;
  transition:color .25s ease;
}
nav.primary-nav a::after{
  content:''; position:absolute; left:0; bottom:-2px; width:0; height:2px; border-radius:2px;
  background:linear-gradient(90deg,var(--violet),var(--aurora)); transition:width .3s ease;
}
nav.primary-nav a:hover, nav.primary-nav a:focus-visible{color:var(--text);}
nav.primary-nav a:hover::after, nav.primary-nav a:focus-visible::after{width:100%;}

.btn{
  display:inline-flex; align-items:center; gap:8px; white-space:nowrap;
  font-family:var(--font-body); font-weight:700; font-size:.92rem;
  padding:12px 22px; border-radius:999px; border:1px solid transparent;
  transition:transform .25s ease, box-shadow .25s ease, background .25s ease, border-color .25s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{
  background:linear-gradient(120deg,var(--violet),var(--pink));
  color:#fff; box-shadow:0 8px 26px -8px rgba(177,94,255,.7);
}
.btn-primary:hover{box-shadow:0 10px 34px -6px rgba(177,94,255,.9); transform:translateY(-2px);}
.btn-ghost{
  background:rgba(255,255,255,.03); color:var(--text); border-color:var(--border-strong);
}
.btn-ghost:hover{background:rgba(255,255,255,.07); border-color:var(--aurora);}

.burger{
  display:none; width:42px; height:42px; border-radius:12px; border:1px solid var(--border);
  background:rgba(255,255,255,.03); align-items:center; justify-content:center; flex-direction:column; gap:5px;
}
.burger span{width:18px; height:2px; background:var(--text); border-radius:2px; transition:transform .3s ease, opacity .3s ease;}
.burger.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
.burger.open span:nth-child(2){opacity:0;}
.burger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}

@media (max-width:900px){
  nav.primary-nav{
    position:fixed; inset:0 0 0 auto; width:min(78vw,320px); height:100vh;
    background:rgba(12,6,22,.98); backdrop-filter:blur(20px);
    flex-direction:column; align-items:flex-start; justify-content:center; gap:26px;
    padding:40px; transform:translateX(100%); transition:transform .4s cubic-bezier(.65,0,.35,1);
    border-left:1px solid var(--border);
  }
  nav.primary-nav.open{transform:translateX(0);}
  nav.primary-nav a{font-size:1.2rem;}
  .header-cta{display:none;}
  .burger{display:flex;}
}

/* ================================================================
   HERO
   ================================================================ */
.hero{
  min-height:100svh; display:flex; align-items:center; padding:150px 0 90px;
  position:relative;
}
.hero-inner{max-width:820px;}
.hero .eyebrow{
  background:rgba(43,245,198,.08); border:1px solid rgba(43,245,198,.3);
  padding:7px 14px; border-radius:999px;
}
.hero .eyebrow::before{display:none;}
.hero h1{
  font-size:clamp(3rem,9vw,6.2rem); line-height:.95; margin:18px 0 22px;
  background:linear-gradient(115deg,#fff 20%,var(--violet) 55%,var(--aurora) 85%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:gradient-pan 8s ease infinite; background-size:200% 200%;
}
@keyframes gradient-pan{
  0%,100%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
}
.hero p.lead{font-size:1.2rem; color:var(--muted); max-width:600px; margin:0 0 40px;}
.hero p.lead strong{color:var(--text);}
.hero-ctas{display:flex; flex-wrap:wrap; gap:16px; margin-bottom:64px;}

.hero-stats{
  display:grid; grid-template-columns:repeat(3,auto); gap:48px;
  padding-top:36px; border-top:1px solid var(--border); max-width:640px;
}
.stat b{
  display:block; font-family:var(--font-mono); font-size:clamp(1.6rem,3vw,2.2rem);
  color:var(--text); font-variant-numeric:tabular-nums;
}
.stat span{font-size:.82rem; color:var(--muted-2); text-transform:uppercase; letter-spacing:.06em;}
@media (max-width:560px){
  .hero-stats{grid-template-columns:repeat(3,1fr); gap:18px;}
}

.hero-tags{
  position:absolute; right:0; top:50%; transform:translateY(-50%);
  display:flex; flex-direction:column; gap:14px; max-width:280px;
}
.hero-tags span{
  font-family:var(--font-mono); font-size:.78rem; color:var(--muted);
  padding:9px 16px; border:1px solid var(--border); border-radius:999px;
  background:rgba(255,255,255,.02); backdrop-filter:blur(6px);
  animation:float-tag 6s ease-in-out infinite;
}
.hero-tags span:nth-child(odd){animation-delay:-2s;}
.hero-tags span:nth-child(3n){animation-delay:-4s;}
@keyframes float-tag{
  0%,100%{transform:translateX(0);}
  50%{transform:translateX(-14px);}
}
@media (max-width:1150px){ .hero-tags{display:none;} }

/* ================================================================
   REVEAL ON SCROLL
   ================================================================ */
.reveal{opacity:0; transform:translateY(28px); transition:opacity .7s ease, transform .7s cubic-bezier(.2,.7,.3,1);}
.reveal.in-view{opacity:1; transform:translateY(0);}
.reveal-stagger.in-view > *{animation:none;}

/* ================================================================
   SERVICIOS
   ================================================================ */
.services-grid{
  display:grid; grid-template-columns:repeat(3,1fr); gap:26px;
}
@media (max-width:980px){ .services-grid{grid-template-columns:1fr; max-width:560px;} }

.card{
  position:relative; border-radius:var(--radius-l);
  background:linear-gradient(180deg,var(--surface),var(--surface-2));
  border:1px solid var(--border);
  padding:36px 30px 30px;
  isolation:isolate;
  overflow:hidden;
}
@property --angle{ syntax:'<angle>'; inherits:false; initial-value:0deg; }
.card::before{
  content:''; position:absolute; inset:0; border-radius:inherit; padding:1.5px;
  background:conic-gradient(from var(--angle),transparent 0 60%,var(--violet),var(--aurora),transparent 100%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  opacity:0; transition:opacity .5s ease; pointer-events:none; z-index:1;
}
.card:hover::before{opacity:1; animation:spin-angle 3.2s linear infinite;}
@keyframes spin-angle{to{--angle:360deg;}}
.card:hover{transform:translateY(-6px);}
.card{transition:transform .4s cubic-bezier(.2,.7,.3,1);}

.card-icon{
  width:56px; height:56px; border-radius:16px; display:flex; align-items:center; justify-content:center;
  font-size:1.6rem; background:rgba(177,94,255,.1); border:1px solid var(--border-strong); margin-bottom:20px;
}
.card .eyebrow{font-size:.68rem;}
.card h3{font-size:1.4rem; margin-bottom:12px;}
.card > p.desc{color:var(--muted); font-size:.95rem; margin:0 0 22px;}

.price-list{margin:0 0 22px; display:flex; flex-direction:column; gap:10px;}
.price-list li{
  display:flex; justify-content:space-between; align-items:baseline; gap:12px;
  font-size:.88rem; padding-bottom:10px; border-bottom:1px dashed var(--border);
  list-style:none;
}
.price-list li:last-child{border-bottom:none; padding-bottom:0;}
.price-list .lbl{color:var(--muted);}
.price-list .amt{font-family:var(--font-mono); color:var(--aurora); font-weight:600; white-space:nowrap;}
.price-list .save{font-size:.72rem; color:var(--pink); margin-left:6px;}

.card .howto{
  font-size:.82rem; color:var(--muted-2); background:rgba(255,255,255,.02);
  border-radius:var(--radius-s); padding:14px; margin-bottom:22px; line-height:1.55;
}
.card .howto b{color:var(--muted);}

.card .btn{width:100%; justify-content:center;}

/* ================================================================
   TRABAJOS / PORTFOLIO
   ================================================================ */
.portfolio-scroll{
  display:grid; grid-auto-flow:column; grid-auto-columns:min(78vw,340px);
  gap:22px; overflow-x:auto; padding-bottom:14px; scroll-snap-type:x mandatory;
  scrollbar-width:thin; scrollbar-color:var(--violet-soft) transparent;
}
.portfolio-scroll::-webkit-scrollbar{height:6px;}
.portfolio-scroll::-webkit-scrollbar-thumb{background:var(--violet-soft); border-radius:6px;}

.pf-card{
  scroll-snap-align:start; border-radius:var(--radius-m); overflow:hidden;
  border:1px solid var(--border); background:var(--surface);
}
.pf-thumb{
  height:220px; position:relative; display:flex; align-items:flex-end; padding:18px;
  background-size:220% 220%; animation:gradient-pan 10s ease infinite;
}
.pf-thumb.ropa{background-image:linear-gradient(135deg,#3a0f63,#b15eff,#ff3d7d);}
.pf-thumb.props{background-image:linear-gradient(135deg,#0f4a63,#2bf5c6,#3a0f63);}
.pf-thumb.vehiculos{background-image:linear-gradient(135deg,#4a0f2c,#ff3d7d,#8c4bd6);}
.pf-thumb .tag{
  font-family:var(--font-mono); font-size:.72rem; background:rgba(10,5,18,.55);
  padding:6px 12px; border-radius:999px; backdrop-filter:blur(6px);
}
.pf-body{padding:18px 20px 22px;}
.pf-body h4{font-family:var(--font-display); font-size:1.05rem; margin:0 0 6px;}
.pf-body p{font-size:.85rem; color:var(--muted); margin:0;}
.pf-note{margin-top:26px; color:var(--muted-2); font-size:.88rem;}
.pf-note a{color:var(--aurora); font-weight:700;}

/* ================================================================
   SCRIPTS
   ================================================================ */
.scripts-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:22px;}
@media (max-width:980px){ .scripts-grid{grid-template-columns:1fr; max-width:520px;} }
.script-card{
  border:1px solid var(--border); border-radius:var(--radius-m); background:var(--surface);
  padding:26px; display:flex; flex-direction:column; gap:14px;
  transition:border-color .3s ease, transform .3s ease;
}
.script-card:hover{border-color:var(--border-strong); transform:translateY(-4px);}
.script-card .tagchip{
  align-self:flex-start; font-family:var(--font-mono); font-size:.7rem; color:var(--aurora);
  border:1px solid rgba(43,245,198,.35); padding:4px 10px; border-radius:999px;
}
.script-card h4{font-size:1.15rem; margin:0;}
.script-card p{font-size:.9rem; color:var(--muted); margin:0; flex:1;}

/* ================================================================
   RESEÑAS
   ================================================================ */
.reviews-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:22px;}
@media (max-width:980px){ .reviews-grid{grid-template-columns:1fr 1fr;} }
@media (max-width:640px){ .reviews-grid{grid-template-columns:1fr;} }

  border:1px solid var(--border); border-radiu
